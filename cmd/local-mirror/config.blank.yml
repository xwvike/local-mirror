# local-mirror 配置文件
#
# 推荐方式：以前台验证过的参数执行 local-mirror service install，任务自动写入本文件并
# 启动服务（Linux 上需 sudo），例如：
#   sudo local-mirror service install --receive --listen -p /srv/backup --allow-delete --gen-key
#
# 手工填写：取消下方注释并填写字段，然后执行 local-mirror service restart（Linux 上需 sudo）
# 注册并启动服务。
#
# 观测：local-mirror --status --all
#
# tasks:
#   - name: backup            # 实例别名，缺省取 path 的最后一段
#     receive: true           # 本机是接收端（数据流入）；发送端用 send: true
#     listen: true            # 等对端拨入；主动拨出用 connect: host[:port]
#     path: /srv/backup       # 同步根（必填）
#     allow_delete: true      # 忠实镜像（含删除）；不给则只增不删
#     loglevel: warn          # debug / info / warn / error
#     secret: <--gen-key 生成的 key 贴这里>   # 监听端必须有 key：填这里或在同步根放 .local-mirror/key；拨号端不填则明文
#     ignore: [node_modules, dist]           # 额外忽略项
